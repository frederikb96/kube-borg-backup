name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'apps/**'
              - 'mypy.ini'
              - 'pytest.ini'
              - '.ruff.toml'
              - '.github/workflows/ci.yaml'
            chart:
              - 'charts/**'
              - '.ct.yaml'
              - '.github/workflows/ci.yaml'

  ruff:
    name: Ruff Lint
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r apps/requirements-dev.txt

      - name: Run ruff
        run: ruff check apps/

  mypy:
    name: Mypy Type Check
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            apps/controller/requirements.txt
            apps/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/controller/requirements.txt -r apps/requirements-dev.txt

      - name: Run mypy
        run: mypy --config-file mypy.ini

  pytest:
    name: Pytest
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            apps/controller/requirements.txt
            apps/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/controller/requirements.txt -r apps/requirements-dev.txt

      - name: Run pytest
        run: pytest

  helm-lint:
    name: Lint Helm chart
    needs: detect
    if: ${{ needs.detect.outputs.chart == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with: { version: v4.3.0 }

      - name: Set up Python (for yamllint/yamale used by ct lint)
        uses: actions/setup-python@v7
        with: { python-version: "3.x", check-latest: true }

      - name: Install chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: List changed charts
        id: list
        run: |
          changed=$(ct list-changed --config .ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Lint charts
        if: steps.list.outputs.changed == 'true'
        run: ct lint --config .ct.yaml --target-branch ${{ github.event.repository.default_branch }}

  ci-ok:
    name: CI ok
    needs: [detect, ruff, mypy, pytest, helm-lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          for result in \
            "${{ needs.detect.result }}" \
            "${{ needs.ruff.result }}" \
            "${{ needs.mypy.result }}" \
            "${{ needs.pytest.result }}" \
            "${{ needs.helm-lint.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
